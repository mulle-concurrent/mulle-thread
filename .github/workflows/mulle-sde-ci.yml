name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: release
  OTHER_PROJECTS: "mulle-c/mulle-c-developer;"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest] # macos-latest,

    steps:
    - name: Set MULLE_HOSTNAME
      run: |
        name="${GITHUB_REF##*/}"
        MULLE_HOSTNAME="${MULLE_HOSTNAME:-ci-${name##*-}}"
        echo "MULLE_HOSTNAME=${MULLE_HOSTNAME}" >> $GITHUB_ENV

    - name: Add to path
      run:  echo "$HOME/bin" >> $GITHUB_PATH

    - name: Dump Environment
      run:  env | sort

    - uses: actions/checkout@v4

    - uses: mulle-sde/github-ci@v2

    - name: Dump Project Environment
      run:  |
        [ ! -d .mulle/etc/env ] || ls -l .mulle/etc/env/environment*.sh
        mulle-sde environment

    - name: Mulle-SDE Fetch
      run: mulle-sde fetch

    - name: Mulle-SDE Craft
      run: mulle-sde craft --${BUILD_TYPE:-release}

    - name: Mulle-SDE Test
      run: |
        [ ! -d test ] || mulle-sde test

  sanitizers:
    runs-on: ubuntu-latest
    env:
      MULLE_HOSTNAME: ci-sanitizers

    steps:
    - name: Add to path
      run:  echo "$HOME/bin" >> $GITHUB_PATH

    - uses: actions/checkout@v4

    - uses: mulle-sde/github-ci@v2

    - name: Mulle-SDE Fetch
      run: mulle-sde fetch

    - name: Mulle-SDE Craft (ASAN + UBSAN)
      run: |
        mulle-sde craft --debug \
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

    - name: Mulle-SDE Test (ASAN + UBSAN)
      run: |
        [ ! -d test ] || mulle-sde test
      env:
        ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1"
        UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"

  thread-sanitizer:
    runs-on: ubuntu-latest
    env:
      MULLE_HOSTNAME: ci-thread-sanitizer

    steps:
    - name: Add to path
      run:  echo "$HOME/bin" >> $GITHUB_PATH

    - uses: actions/checkout@v4

    - uses: mulle-sde/github-ci@v2

    - name: Mulle-SDE Fetch
      run: mulle-sde fetch

    - name: Mulle-SDE Craft (TSAN)
      run: |
        mulle-sde craft --debug \
          -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"

    - name: Mulle-SDE Test (TSAN)
      run: |
        [ ! -d test ] || mulle-sde test
      env:
        TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"

  build-32bit:
    runs-on: ubuntu-latest
    env:
      MULLE_HOSTNAME: ci-32bit

    steps:
    - name: Install 32-bit toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib

    - name: Add to path
      run:  echo "$HOME/bin" >> $GITHUB_PATH

    - uses: actions/checkout@v4

    - uses: mulle-sde/github-ci@v2

    - name: Mulle-SDE Fetch
      run: mulle-sde fetch

    - name: Mulle-SDE Craft (32-bit)
      run: |
        mulle-sde craft --release \
          -DCMAKE_C_FLAGS="-m32" \
          -DCMAKE_EXE_LINKER_FLAGS="-m32" \
          -DCMAKE_SHARED_LINKER_FLAGS="-m32"

    - name: Mulle-SDE Test (32-bit)
      run: |
        [ ! -d test ] || mulle-sde test

  valgrind:
    runs-on: ubuntu-latest
    env:
      MULLE_HOSTNAME: ci-valgrind

    steps:
    - name: Install valgrind
      run: |
        sudo apt-get update
        sudo apt-get install -y valgrind

    - name: Add to path
      run:  echo "$HOME/bin" >> $GITHUB_PATH

    - uses: actions/checkout@v4

    - uses: mulle-sde/github-ci@v2

    - name: Mulle-SDE Fetch
      run: mulle-sde fetch

    - name: Mulle-SDE Test (valgrind)
      run: |
        [ ! -d test ] || mulle-sde test --valgrind
